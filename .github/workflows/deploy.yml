name: Deploy web-portofolio

# Auto-deploy DINONAKTIFKAN selama redesign v4.
# Build sekarang adapter-static (tidak ada build/index.js), sedangkan step
# di bawah masih `pm2 restart` proses adapter-node — kalau jalan, situs mati.
# Deploy dirombak total ke Caddy static + gate quality di fase F5.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest code
        working-directory: /home/ubuntu/projects/web-portofolio
        run: |
          set -e
          git fetch origin
          git reset --hard origin/main
          echo "✅ Code updated to $(git rev-parse --short HEAD)"

      - name: Install dependencies
        working-directory: /home/ubuntu/projects/web-portofolio
        run: |
          set -e
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
          npm install
          echo "✅ Dependencies installed"

      - name: Build
        working-directory: /home/ubuntu/projects/web-portofolio
        run: |
          set -e
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
          npm run build
          echo "✅ Built"

      - name: Restart PM2
        run: |
          set -e
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
          export PATH="$HOME/.local/bin:$PATH"
          pm2 restart web-portofolio
          pm2 save
          echo "✅ Deployed successfully"
